version: "1"

package:
  id: cn.org.linyaps.demo
  name: demo
  kind: app
  version: 1.0.0.0
  description: |
    A simple demo app.

command:
  - start.bash

base: org.deepin.base/23.1.0
runtime: org.deepin.runtime.dtk/23.1.0

build: |
  rm -rf build || true
  mkdir build
  cd build
  qmake ..
  make
  make install
  cd ..
  cp start.sh $PREFIX/bin/
  chmod +x $PREFIX/bin/start.sh
